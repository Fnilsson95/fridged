# Dependabot opens PRs when a dependency has a new version.
# CI runs on each PR
version: 2
updates:
  # Python packages in backend/uv.lock
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      # Collect all minor and patch updates into one PR per week
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used in .github/workflows (checkout, setup-uv, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
