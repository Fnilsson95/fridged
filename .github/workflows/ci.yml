name: CI

on:
  push:
    branches: [main] # every push to main
  pull_request: # Runs on PR (for dependabot)

permissions:
  contents: read

# Cancel older one if new one comes in
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # run the code at tag v7

      - name: Setup up uv and python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # keyed on uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q --cov

      - name: Migrations match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
