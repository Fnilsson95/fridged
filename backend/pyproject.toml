# Decribes the fridged backend package (name, python version and depencdencies, etc)
# and hold the settings for tools (pytest, ruff)
# Install only with .venv or the packages end up in the global python and they will be missing

# How the package is built. setuptools is the standard, no-surprises choice.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fridged-backend"
version = "0.1.0"
# Check `python3 --version` on the Pi before raising this
requires-python = ">=3.11"

# Needed to run the app. The Pi installs these too.
dependencies = [
    "fastapi",            # the web framework
    "uvicorn",            # the server that runs FastAPI
    "sqlalchemy>=2.0",    # ORM (Object-Relational Mapping): tables as Python classes (classes = tables, properties = columns, objects = rows)
    "alembic",            # database migrations
    "pydantic-settings",  # reads settings from environment variables
]

# Only needed while developing. Install with: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest",  # test runner
    "pytest-cov", # measures which lines the tests run
    "httpx",   # required by FastAPI's TestClient
    "ruff",    # linter and formatter
]

# Tell setuptools which folder is the package (so `import app` works everywhere)
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # where pytest looks for tests

[tool.ruff]
line-length = 100
# Migrations are generated by Alembic, don't lint them
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F: errors and unused code, I: import order, UP: modern Python, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app"] # measaure our code, not the tests or installed libraries
branch = true # check both sides of each if/else

[tool.coverage.report]
fail_under = 95 # fail if total coverage below 95%
show_missing = true # list the line numbers that were never run
skip_covered = true # hide files at 100%